<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typical Rectangle Between Two Curves</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)']] },
    svg: { fontCache: 'global' },
    startup: { typeset: false }
  };
</script>
<script id="mj" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
  :root{
    --bg:#fafaf7; --card:#fff; --ink:#1f2430; --muted:#6a7080; --line:#e3e3dc;
    --accent:#dc2626; --rect:rgba(220,38,38,.35); --rectLine:#dc2626;
    --f:#1e3a8a; --g:#7c3aed; --region:rgba(120,120,120,.13);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#16181d; --card:#1e2128; --ink:#e8eaf0; --muted:#98a0b3; --line:#323744;
      --accent:#f87171; --rect:rgba(248,113,113,.4); --rectLine:#f87171;
      --f:#8fb0ff; --g:#c4b5fd; --region:rgba(200,200,200,.12);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
  main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  h1{font:700 1.5rem/1.65 Georgia,"Times New Roman",serif;margin:0 0 .6rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .plotwrap{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:566/578}
  .legend{position:absolute;top:0;left:16.25%;display:flex;flex-wrap:wrap;gap:2px 18px;font-size:.95em;line-height:1.2;pointer-events:none}
  .legend i{display:inline-block;width:22px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
  .lbl{position:absolute;white-space:nowrap;line-height:1;pointer-events:none;font-size:.98em}
  #lf{color:var(--f);transform:translate(0,-50%)}
  #lg{color:var(--g);transform:translate(0,-50%)}
  #lxi{color:var(--rectLine);transform:translate(-50%,-50%)}
  #ldx{color:var(--muted);transform:translate(-50%,-50%);font-size:.7em}
  mjx-container{color:inherit}
  svg#plot{width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  svg#plot .drag{cursor:grab}
  svg#plot.dragging .drag{cursor:grabbing}
  svg#plot:focus{outline:none}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:10px}
  .ctl label{font-weight:600;flex:1}
  .ctl output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:1.1rem}
  input[type=range]{flex:1 1 100%;width:100%;accent-color:var(--accent);height:28px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .stat b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .stat span{font-size:.8rem;color:var(--muted)}
  sub{font-size:.7em}
</style>
</head>
<body>
<main>
  <h1>The typical rectangle</h1>
  <div class="card">
    <div class="plotwrap"><div class="legend"><span><i style="background:var(--f)"></i>\(f(x) = 2x - x^2\)</span><span><i style="background:var(--g)"></i>\(g(x) = x^2\)</span></div><div class="lbl" id="lf">\(f(x_i)\)</div><div class="lbl" id="lg">\(g(x_i)\)</div><div class="lbl" id="lxi">\(x_i\)</div><div class="lbl" id="ldx">\(\Delta x\)</div><svg id="plot" viewBox="0 0 566 578" tabindex="0" role="img" aria-label="A typical rectangle between f(x) = 2x - x^2 and g(x) = x^2; drag the point x_i on the axis"></svg></div>
  </div>
</main>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("plot");
// Equal scale on both axes (x and y both run over [0,1]).
const L=92, T=48, side=450, DX=1/23, S=566, H=578;
const X=x=>L+x*side, Y=y=>T+(1-y)*side;
const f=x=>2*x-x*x, g=x=>x*x;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const P=(x,y)=>X(x).toFixed(2)+","+Y(y).toFixed(2);
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e;}

let xi=0.6;

function labelYs(){
  let yf=Y(f(xi)), yg=Y(g(xi));
  if(yg-yf<30){const d=(30-(yg-yf))/2; yf-=d; yg+=d;}   // keep the two labels from colliding
  return [yf,yg];
}
function draw(){
  svg.innerHTML="";
  const ink=css("--ink"), muted=css("--muted"), line=css("--line"), rect=css("--rect"), rl=css("--rectLine");
  const cf=css("--f"), cg=css("--g"), region=css("--region"), card=css("--card");
  for(let k=0;k<=10;k++){
    const t=k/10;
    el("line",{x1:X(t),y1:Y(0),x2:X(t),y2:Y(1),stroke:line,"stroke-width":1});
    el("line",{x1:X(0),y1:Y(t),x2:X(1),y2:Y(t),stroke:line,"stroke-width":1});
    if(k%2===0){
      if(Math.abs(t-xi)>0.07) el("text",{x:X(t),y:Y(0)+18,"text-anchor":"middle","font-size":12,fill:muted}).textContent=t.toFixed(1);
      const [lyf,lyg]=labelYs();
      if(Math.abs(Y(t)-lyf)>20 && Math.abs(Y(t)-lyg)>20) el("text",{x:X(0)-8,y:Y(t)+4,"text-anchor":"end","font-size":12,fill:muted}).textContent=t.toFixed(1);
    }
  }
  let d="M"; const M=200;
  for(let k=0;k<=M;k++){const x=k/M; d+=(k?" L":"")+P(x,f(x));}
  for(let k=M;k>=0;k--){const x=k/M; d+=" L"+P(x,g(x));}
  el("path",{d:d+" Z",fill:region,stroke:"none"});
  el("line",{x1:X(0),y1:Y(0),x2:X(1)+10,y2:Y(0),stroke:ink,"stroke-width":1.5});
  el("line",{x1:X(0),y1:Y(0),x2:X(0),y2:Y(1)-10,stroke:ink,"stroke-width":1.5});
  let df="", dg="";
  for(let k=0;k<=M;k++){const x=k/M; df+=(k?"L":"M")+P(x,f(x)); dg+=(k?"L":"M")+P(x,g(x));}
  el("path",{d:df,fill:"none",stroke:cf,"stroke-width":2.5});
  el("path",{d:dg,fill:"none",stroke:cg,"stroke-width":2.5});
  // typical rectangle: width Δx, centered at x_i (x_i = midpoint), from g(x_i) up to f(x_i)
  const lo=g(xi), hi=f(xi);
  // dashed lines (curve colors) from the points on the curves over to the y-axis, with dots on the axis
  for(const [yy,col] of [[hi,cf],[lo,cg]]){
    el("line",{x1:X(xi),y1:Y(yy),x2:X(0),y2:Y(yy),stroke:col,"stroke-width":1.5,"stroke-dasharray":"4 4"});
    el("circle",{cx:X(0),cy:Y(yy),r:4.5,fill:col});   // marks f(x_i) / g(x_i) on the y-axis
  }
  el("rect",{class:"drag",x:X(xi-DX/2),y:Y(hi),width:X(xi+DX/2)-X(xi-DX/2),height:Y(lo)-Y(hi),fill:rl,"fill-opacity":1,stroke:rl,"stroke-width":2});
  // guide from the axis to the top of the rectangle
  el("line",{x1:X(xi),y1:Y(0),x2:X(xi),y2:Y(g(xi)),stroke:rl,"stroke-width":1.5,"stroke-dasharray":"4 4"});
  // dashed line from g(x_i) up to f(x_i), drawn over the filled rectangle
  el("line",{x1:X(xi),y1:Y(g(xi)),x2:X(xi),y2:Y(f(xi)),stroke:ink,"stroke-width":1.5,"stroke-dasharray":"4 4","pointer-events":"none"});
  // points on the curves at x = x_i
  el("circle",{cx:X(xi),cy:Y(hi),r:4.5,fill:cf});
  el("circle",{cx:X(xi),cy:Y(lo),r:4.5,fill:cg});
  // Δx bracket under the axis
  const by=Y(0)+52;
  el("line",{x1:X(xi-DX/2),y1:by,x2:X(xi+DX/2),y2:by,stroke:muted,"stroke-width":1.5});
  el("line",{x1:X(xi-DX/2),y1:by-5,x2:X(xi-DX/2),y2:by+5,stroke:muted,"stroke-width":1.5});
  el("line",{x1:X(xi+DX/2),y1:by-5,x2:X(xi+DX/2),y2:by+5,stroke:muted,"stroke-width":1.5});

  // draggable handle on the x-axis, with a large invisible touch target
  el("circle",{class:"drag",cx:X(xi),cy:Y(0),r:26,fill:"transparent"});
  el("circle",{cx:X(xi),cy:Y(0),r:8,fill:rl,stroke:card,"stroke-width":2,"pointer-events":"none"});
}

function place(id,x,y){const e=document.getElementById(id); e.style.left=(x/S*100)+"%"; e.style.top=(y/H*100)+"%";}
function placeR(id,xr,y){const e=document.getElementById(id); e.style.left="auto"; e.style.right=((S-xr)/S*100)+"%"; e.style.top=(y/H*100)+"%";}
function update(){
  draw();
  const by=Y(0)+52;
  const [yf,yg]=labelYs();
  placeR("lf",X(0)-14,yf);
  placeR("lg",X(0)-14,yg);
  place("lxi",X(xi),Y(0)+26);
  place("ldx",X(xi),by+19);
}
function setXi(v){
  xi=Math.min(1,Math.max(0,Math.round(v*100)/100));
  update();
}
function fromEvent(e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  setXi((p.x-L)/side);
}
let dragging=false;
svg.addEventListener("pointerdown",e=>{
  if(!e.target.classList||!e.target.classList.contains("drag")) return;
  dragging=true; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId); fromEvent(e); e.preventDefault();
});
svg.addEventListener("pointermove",e=>{ if(dragging) fromEvent(e); });
const stop=()=>{dragging=false; svg.classList.remove("dragging");};
svg.addEventListener("pointerup",stop);
svg.addEventListener("pointercancel",stop);
svg.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){setXi(xi-0.01);e.preventDefault();}
  if(e.key==="ArrowRight"){setXi(xi+0.01);e.preventDefault();}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",update);
update();
document.getElementById("mj").addEventListener("load",()=>{ MathJax.startup.promise.then(()=>MathJax.typesetPromise()); });
</script>
</body>
</html>
