<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peeling a circular strip</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)']] },
    svg: { fontCache: 'global' },
    startup: { typeset: false }
  };
</script>
<script id="mj" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
  :root{
    --bg:#fafaf7; --card:#fff; --ink:#1f2430; --muted:#6a7080; --line:#e3e3dc;
    --accent:#dc2626; --strip:rgba(42,111,219,.35); --stripLine:#2a6fdb; --dash:#c2410c;
    --region:rgba(120,120,120,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#16181d; --card:#1e2128; --ink:#e8eaf0; --muted:#98a0b3; --line:#323744;
      --accent:#f87171; --strip:rgba(110,162,255,.38); --stripLine:#6ea2ff; --dash:#fb923c;
      --region:rgba(200,200,200,.12);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
  main{max-width:640px;margin:0 auto;padding:16px 10px 32px}
  h1{font:700 1.5rem/1.65 Georgia,"Times New Roman",serif;margin:0 0 .6rem}
  p.desc{font:1rem/1.5 Georgia,"Times New Roman",serif;margin:0 0 .9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .plotwrap{container-type:inline-size;position:relative;width:100%;margin:0 auto}
  svg#plot{width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  svg#plot:focus{outline:none}
  svg#plot .drag{cursor:grab}
  svg#plot.dragging .drag{cursor:grabbing}
  .lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1;pointer-events:none;
       font-size:15px;font-size:clamp(13px,4cqw,18px);color:var(--ink);
       text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
  .lbl.sm{font-size:13px;font-size:clamp(12px,3.4cqw,16px);color:var(--muted);font-family:Georgia,serif;font-style:italic}
  mjx-container{color:inherit}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:10px}
  .ctl label,.ctl .cap{font-weight:600;flex:1}
  .ctl output{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--stripLine);font-size:1.1rem}
  input[type=range]{flex:1 1 100%;width:100%;accent-color:var(--stripLine);height:28px}
  .seg{display:flex;gap:8px}
  .seg button{font:inherit;min-width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--stripLine);color:#fff;border-color:var(--stripLine)}
</style>
</head>
<body>
<main>
  <h1>Peeling a circular strip</h1>
  <p class="desc">The circle of radius \(R\) is divided into \(N = 4\) concentric strips of equal thickness \(\Delta r\). Choose a strip and watch it peel off the circle and flatten into a rectangle.</p>
  <div class="card">
    <div class="plotwrap" style="aspect-ratio:640/262">
      <div class="lbl" id="lR">\(R\)</div>
      <div class="lbl" id="ldr">\(\Delta r\)</div>
      <svg id="plot" viewBox="0 0 640 262" role="img" aria-label="A circle cut into four concentric strips; one strip peels off and flattens into a rectangle"></svg>
    </div>
    <div class="ctl"><span class="cap">Strip</span>
      <div class="seg" id="seg">
        <button type="button" data-i="1" aria-pressed="false">1</button>
        <button type="button" data-i="2" aria-pressed="false">2</button>
        <button type="button" data-i="3" aria-pressed="true">3</button>
        <button type="button" data-i="4" aria-pressed="false">4</button>
      </div>
    </div>
  </div>
</main>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("plot");
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e;}
function place(id,x,y){const e=document.getElementById(id);e.style.left=(X(x)/W*100)+"%";e.style.top=(Y(y)/H*100)+"%";}
function annulus(ri,ro){
  const cx=X(0),cy=Y(0),a=ro*U,b=ri*U;
  let d="M"+(cx-a)+","+cy+" a"+a+","+a+" 0 1,0 "+2*a+",0 a"+a+","+a+" 0 1,0 "+(-2*a)+",0 Z";
  if(ri>0) d+=" M"+(cx-b)+","+cy+" a"+b+","+b+" 0 1,0 "+2*b+",0 a"+b+","+b+" 0 1,0 "+(-2*b)+",0 Z";
  return d;
}
function ticks(x1,y1,x2,y2,tx,ty,stroke){   // double-ended bracket with end ticks (units)
  el("line",{x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2),stroke,"stroke-width":1.6});
  for(const [px,py] of [[x1,y1],[x2,y2]])
    el("line",{x1:X(px-tx),y1:Y(py-ty),x2:X(px+tx),y2:Y(py+ty),stroke,"stroke-width":1.6});
}

const R=4, N=4, h=R/N, U=24, W=640, H=262, CX=320, YT=4.6, GAP=0.5;
const X=x=>CX+x*U, Y=y=>(YT-y)*U;
let sel=3, t=0, t0=performance.now();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
// loop: hold the closed circle, peel, hold the rectangle, roll back up (about 5 s per cycle)
const HOLD0=0.5, PEEL=1.8, HOLD1=0.8, BACK=1.8, CYCLE=HOLD0+PEEL+HOLD1+BACK;
const ease=u=>u*u*(3-2*u);
function phase(sec){
  const c=sec%CYCLE;
  if(c<HOLD0) return 0;
  if(c<HOLD0+PEEL) return ease((c-HOLD0)/PEEL);
  if(c<HOLD0+PEEL+HOLD1) return 1;
  return 1-ease((c-HOLD0-PEEL-HOLD1)/BACK);
}

function band(r,k,ty){   // returns {outer:[...], inner:[...], mid:[...], end:{...}} in units
  const L=2*Math.PI*r, M=220, out=[], inn=[];
  const C=s=>{const a=k*s; if(k<1e-9) return [s,0,a];
    if(Math.abs(a)<1e-6) return [s,k*s*s/2,a];
    return [Math.sin(a)/k,(1-Math.cos(a))/k,a];};
  for(let m=0;m<=M;m++){
    const s=-L/2+L*m/M, [cx,cy,a]=C(s), nx=Math.sin(a), ny=-Math.cos(a);
    out.push([cx+h/2*nx,cy+h/2*ny+ty]); inn.push([cx-h/2*nx,cy-h/2*ny+ty]);
  }
  const [ex,ey,ea]=C(-L/2);
  return {out,inn,end:{x:ex,y:ey+ty,tx:Math.cos(ea),ty:Math.sin(ea),nx:Math.sin(ea),ny:-Math.cos(ea)}};
}

function draw(){
  svg.innerHTML="";
  const ink=css("--ink"), card=css("--card"), muted=css("--muted"), strip=css("--strip"), sl=css("--stripLine"), region=css("--region");
  // the four rings
  for(let j=1;j<=N;j++){
    const d=annulus((j-1)*h,j*h);
    if(j!==sel) el("path",{d,"fill-rule":"evenodd",fill:card,stroke:ink,"stroke-width":1.2});
    else if(t<0.001) el("path",{d,"fill-rule":"evenodd",fill:strip,stroke:sl,"stroke-width":1.6});
    else el("path",{d,"fill-rule":"evenodd",fill:region,stroke:muted,"stroke-width":1.2,"stroke-dasharray":"4 4"});
  }
  // radius R (as in the figure)
  el("line",{x1:X(0),y1:Y(0),x2:X(-R),y2:Y(0),stroke:ink,"stroke-width":2});
  place("lR",-R/2,-0.55);
  // the peeling strip
  const r=(sel-0.5)*h, k=(1-t)/r, ydest=-(R+GAP+h/2), ty=-r+t*(ydest+r);
  if(t>=0.001){
    const b=band(r,k,ty);
    const pts=b.out.concat(b.inn.slice().reverse());
    el("path",{d:"M"+pts.map(p=>X(p[0]).toFixed(2)+","+Y(p[1]).toFixed(2)).join(" L")+" Z",fill:strip,stroke:sl,"stroke-width":1.6,"stroke-linejoin":"round"});
  }
  // thickness marker \Delta r at the cut end of the strip
  const b=band(r,k,ty), e=b.end, ox=-e.tx*0.35, oy=-e.ty*0.35;
  const A=[e.x+ox+e.nx*h/2, e.y+oy+e.ny*h/2], B=[e.x+ox-e.nx*h/2, e.y+oy-e.ny*h/2];
  ticks(A[0],A[1],B[0],B[1],e.tx*0.16,e.ty*0.16,ink);
  place("ldr", e.x-e.tx*1.5, e.y-e.ty*1.5);
}
function tick(now){
  t=phase((now-t0)/1000);
  draw();
  requestAnimationFrame(tick);
}
document.getElementById("seg").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  sel=+b.dataset.i; t0=performance.now();
  for(const x of document.querySelectorAll("#seg button")) x.setAttribute("aria-pressed",x===b);
  if(reduce){t=1;draw();}
});
if(reduce){t=1;draw();} else requestAnimationFrame(tick);

document.getElementById("mj").addEventListener("load",()=>{ MathJax.startup.promise.then(()=>MathJax.typesetPromise()); });
</script>
</body>
</html>
